name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend check & build, backend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Undeclared-identifier check (src/)
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Backend syntax check
        working-directory: server
        run: |
          for f in index.js db.js run_deployment_migrations.js run_tests.js routes/*.js services/*.js scripts/*.js data/*.js tests/*.js; do
            node --check "$f"
          done

  integration:
    name: Integration tests (fresh database)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only values; never real secrets.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: erp_db
      JWT_SECRET: ci-only-jwt-secret
      INITIAL_ADMIN_PASSWORD: ci-admin-pass
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/erp_db
      API_BASE: http://localhost:5000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Start backend
        working-directory: server
        run: |
          nohup node index.js > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -q "Server running" ../backend.log; then echo "Backend is up"; exit 0; fi
            sleep 2
          done
          echo "Backend did not start in time"; cat ../backend.log; exit 1

      - name: Seed test fixtures
        working-directory: server
        env:
          ALLOW_FIXTURE_SEED: "1"
          ADMIN_PASSWORD: ci-admin-pass
        run: node scripts/seed_ci_fixtures.js

      - name: Run integration tests
        working-directory: server
        run: npm test

      - name: Backend log
        if: always()
        run: tail -n 200 backend.log

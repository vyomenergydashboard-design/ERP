services:
  erp-dev:
    # Dependencies are baked into the image (/node_modules); rebuild after package changes:
    #   docker-compose up -d --build erp-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: vyom-erp-dev
    container_name: vyom-erp-dev
    working_dir: /app
    volumes:
      - .:/app
    tmpfs:
      - /app/node_modules # hide host node_modules; packages come from the image
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - backend

  erp-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vyom-erp-prod
    ports:
      - "3001:80"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - prod

  backend:
    # Dependencies are baked into the image (/node_modules); rebuild after package changes:
    #   docker-compose up -d --build backend
    build: ./server
    image: vyom-erp-backend
    container_name: vyom-erp-backend
    working_dir: /app
    volumes:
      - ./server:/app
    tmpfs:
      - /app/node_modules # hide host server/node_modules; packages come from the image
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    environment:
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_NAME=erp_db
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine # pinned major version: the data volume is PostgreSQL 18
    container_name: vyom-erp-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=erp_db
    volumes:
      - pgdata:/var/lib/postgresql
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"

volumes:
  pgdata:
